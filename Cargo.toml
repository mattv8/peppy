[workspace]
members = ["crates/*", "services/*"]
exclude = ["apps/desktop/src-tauri", "vendor/phonenumber"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
axum = "=0.8.6"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
futures-util = "=0.3.31"
hex = "=0.4.3"
hmac = "=0.12.1"
http-body-util = "=0.1.3"
ipnet = "=2.11.0"
libsodium-rs = "=0.2.5"
peppy-client-core = { path = "crates/client-core", version = "0.1.0" }
peppy-desktop-api = { path = "crates/desktop-api", version = "0.1.0" }
peppy-crypto = { path = "crates/crypto", version = "0.1.0" }
peppy-domain = { path = "crates/domain", version = "0.1.0" }
peppy-hosted-api = { path = "crates/hosted-api", version = "0.1.0" }
peppy-protocol = { path = "crates/protocol", version = "0.1.0" }
rand = "=0.8.8"
reqwest = { version = "=0.12.24", default-features = false }
schemars = "=1.0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate", "macros"] }
tempfile = "=3.23.0"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = "=0.28.0"
tokio-util = "=0.7.17"
tower = "=0.5.2"
tracing = "=0.1.41"
tracing-subscriber = "=0.3.20"
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
zeroize = "=1.9.0"
