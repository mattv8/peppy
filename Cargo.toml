[workspace]
members = ["crates/*", "services/*"]
exclude = ["apps/desktop/src-tauri", "vendor/libsodium-sys-stable", "vendor/phonenumber", "vendor/block", "vendor/sqlx-postgres"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"

[workspace.dependencies]
axum = "=0.8.9"
base64 = "=0.23.1"
ed25519-dalek = "=3.0.0"
futures-util = "=0.3.34"
hex = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
http-body-util = "=0.1.5"
ipnet = "=2.12.2"
libsodium-rs = "=0.3.1"
peppy-client-core = { path = "crates/client-core", version = "0.1.0" }
peppy-desktop-api = { path = "crates/desktop-api", version = "0.1.0" }
peppy-crypto = { path = "crates/crypto", version = "0.1.0" }
peppy-domain = { path = "crates/domain", version = "0.1.0" }
peppy-hosted-api = { path = "crates/hosted-api", version = "0.1.0" }
peppy-protocol = { path = "crates/protocol", version = "0.1.0" }
peppy-tester-crypto = { path = "crates/tester-crypto", version = "0.1.0" }
rand = "=0.10.3"
reqwest = { version = "=0.12.24", default-features = false }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.11.1"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "migrate", "macros"] }
tempfile = "=3.23.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = "=0.30.0"
tokio-util = "=0.7.20"
tower = "=0.5.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
url = "=2.5.9"
uuid = { version = "=1.29.3", features = ["serde", "v4"] }
zeroize = "=1.9.2"

[patch.crates-io]
libsodium-sys-stable = { path = "vendor/libsodium-sys-stable" }
sqlx-postgres = { path = "vendor/sqlx-postgres" }

# Keep repeated local checks/tests from accumulating large incremental caches.
# Preserve file/line backtraces without full type and variable debug information.
[profile.dev]
incremental = false
debug = "line-tables-only"

# Argon2id's 256 MiB KDF in libsodium is ~8x slower at -O0.
[profile.dev.package."*"]
opt-level = 3
