services:
  api: !reset null
  migrate: !reset null

  dev:
    image: peppy-dev:${DEV_UID:-1000}-${DEV_GID:-1000}
    build:
      context: .
      dockerfile: docker/development.Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [run, serve]
    environment:
      PEPPY_ENV: ${PEPPY_ENV:-development}
      RUNNING_IN_CONTAINER: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:?set in synthetic environment}:${POSTGRES_PASSWORD:?set in synthetic environment}@postgres:5432/${POSTGRES_DB:?set in synthetic environment}
      S3_INTERNAL_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in synthetic environment}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in synthetic environment}
      S3_BUCKET: ${S3_BUCKET:-peppy-private}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set in synthetic environment}
      PUBLIC_ATTACHMENT_URL: ${PUBLIC_ATTACHMENT_URL:?set in synthetic environment}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8080}
      PEPPY_REPLAY_RETENTION_DAYS: ${PEPPY_REPLAY_RETENTION_DAYS:-30}
      VAULT_ATTACHMENT_QUOTA_BYTES: ${VAULT_ATTACHMENT_QUOTA_BYTES:-536870912}
      PEPPY_SIMULATOR_PASSPHRASE: ${PEPPY_SIMULATOR_PASSPHRASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-7000}:8080"
    healthcheck:
      test: ["CMD", "/home/developer/.local/lib/peppy/peppy-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30m
    volumes:
      - ./:/source:ro
      - ./.opencode/dev/artifacts:/artifacts
      - dev-cargo:/home/developer/.cargo
      - dev-pnpm:/home/developer/.local/share/pnpm
      - dev-target:/workspace/target
    networks: [private, edge]

  android:
    platform: linux/amd64
    profiles: [android]
    build:
      context: .
      dockerfile: docker/android.Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PEPPY_ACCEPT_ANDROID_LICENSES: ${PEPPY_ACCEPT_ANDROID_LICENSES:-}
    volumes:
      - ./:/source:ro
      - ./.opencode/dev/artifacts:/artifacts
      - android-sdk:/opt/android-sdk
      - android-gradle:/home/peppy/.gradle
      - android-cargo:/home/peppy/.cargo
      - android-target:/workspace/target
      - android-debug-keystore:/home/peppy/.android
    networks: [edge]

volumes:
  dev-cargo:
    name: peppy-dev-cargo-${DEV_UID:-1000}-${DEV_GID:-1000}
    external: true
  dev-pnpm:
    name: peppy-dev-pnpm-${DEV_UID:-1000}-${DEV_GID:-1000}
    external: true
  dev-target:
    name: peppy-dev-target-${DEV_UID:-1000}-${DEV_GID:-1000}
    external: true
  android-sdk:
    name: peppy-android-sdk-${DEV_UID:-1000}-${DEV_GID:-1000}
    external: true
  android-gradle:
    name: peppy-android-gradle-${DEV_UID:-1000}-${DEV_GID:-1000}
    external: true
  android-cargo:
    name: peppy-android-cargo-${DEV_UID:-1000}-${DEV_GID:-1000}
    external: true
  android-target:
    name: peppy-android-target-${DEV_UID:-1000}-${DEV_GID:-1000}
    external: true
  android-debug-keystore:
    name: peppy-android-debug-keystore-${DEV_UID:-1000}-${DEV_GID:-1000}
    external: true
