name: CI

on:
  pull_request:
  push:
    branches: [production, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      integration: ${{ steps.scope.outputs.integration }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
      desktop_os_matrix: ${{ steps.scope.outputs.desktop_os_matrix }}
      android: ${{ steps.scope.outputs.android }}
      swift_bindings: ${{ steps.scope.outputs.swift_bindings }}
      container_image: ${{ steps.scope.outputs.container_image }}
      artifacts_android: ${{ steps.scope.outputs.artifacts_android }}
      artifacts_desktop: ${{ steps.scope.outputs.artifacts_desktop }}
      artifacts_ios: ${{ steps.scope.outputs.artifacts_ios }}
      development_artifacts: ${{ steps.scope.outputs.development_artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths-filter.yml
          predicate-quantifier: some-with-excludes
      - id: scope
        shell: bash
        env:
          FILTER_FORCE_FULL: ${{ github.event_name != 'pull_request' }}
          PRODUCTION_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' }}
          FILTER_RUST_SHARED: ${{ steps.filter.outputs.rust_shared }}
          FILTER_RUST_MOBILE: ${{ steps.filter.outputs.rust_mobile }}
          FILTER_RUST_DESKTOP: ${{ steps.filter.outputs.rust_desktop }}
          FILTER_RUST_BROWSER: ${{ steps.filter.outputs.rust_browser }}
          FILTER_RUST_SERVER: ${{ steps.filter.outputs.rust_server }}
          FILTER_ANDROID_BINDINGS: ${{ steps.filter.outputs.android_bindings }}
          FILTER_DESKTOP: ${{ steps.filter.outputs.desktop }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_ANDROID: ${{ steps.filter.outputs.android }}
          FILTER_IOS: ${{ steps.filter.outputs.ios }}
          FILTER_SERVER: ${{ steps.filter.outputs.server }}
          FILTER_BUILD: ${{ steps.filter.outputs.build }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
          FILTER_UNCLASSIFIED: ${{ steps.filter.outputs.unclassified }}
        run: bash .github/scripts/ci-scope.sh

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      base_version: ${{ steps.compute.outputs.base_version }}
      channel: ${{ steps.compute.outputs.channel }}
      bump: ${{ steps.compute.outputs.bump }}
      last_stable: ${{ steps.compute.outputs.last_stable }}
      commits_since: ${{ steps.compute.outputs.commits_since }}
      head_released: ${{ steps.compute.outputs.head_released }}
      wix_version: ${{ steps.compute.outputs.wix_version }}
      android_version: ${{ steps.android-compute.outputs.version }}
      android_tag: ${{ steps.android-compute.outputs.tag }}
      android_version_code: ${{ steps.android-compute.outputs.android_version_code }}
      android_changed: ${{ steps.android-compute.outputs.changed }}
      android_budget_refresh: ${{ steps.android-compute.outputs.budget_refresh }}
      android_head_released: ${{ steps.android-compute.outputs.head_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: infra/release/install-git-cliff.sh "$RUNNER_TEMP/bin"
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: compute
        env:
          CHANNEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'prerelease' || 'dev' }}
        run: infra/release/compute-version.sh --channel "$CHANNEL" | tee -a "$GITHUB_OUTPUT"
      - id: android-compute
        env:
          CHANNEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'prerelease' || 'dev' }}
        run: infra/release/compute-version.sh --component android --channel "$CHANNEL" | tee -a "$GITHUB_OUTPUT"

  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && pnpm install --frozen-lockfile --filter @peppy/desktop --ignore-scripts
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - run: shellcheck infra/release/*.sh infra/release/linux-repository/*.sh
      - run: infra/release/install-git-cliff.sh "$RUNNER_TEMP/bin"
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install Android signing test SDK tools
        run: |
          set +e
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"
      - run: infra/release/test-compute-version.sh
      - run: infra/release/test-release-scripts.sh
      - run: bash infra/release/test-release-asset-groups.sh
      - run: bash infra/release/test-release-prefixes.sh
      - run: infra/release/test-elf-alignment.sh
      - run: infra/release/test-android-signing.sh
      - run: infra/release/test-android-distribution.sh
      - run: infra/release/linux-repository/test-linux-repository.sh
      - name: Test real Linux package normalization
        run: |
          sudo apt-get update && sudo apt-get install --yes rpm gnupg cpio file
          infra/release/test-linux-package-metadata.sh

  release-macos-tooling:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: infra/release/test-desktop-bundles.sh

  source-audit:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod
      - run: python3 infra/audit/check-advisory-exceptions.py
      - run: |
          scan=$(mktemp -d)
          trap 'rm -rf "$scan"' EXIT
          git ls-files -co --exclude-standard -z | tar --null -T - -cf - | tar -xf - -C "$scan"
          docker run --rm -v "$scan:/repo:ro" -v "$PWD/.gitleaks.toml:/gitleaks.toml:ro" -w /repo zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source . --no-git --redact --exit-code 1 --config /gitleaks.toml

  workflow-security:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Gradle wrapper binaries
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint GitHub Actions workflows
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 && "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          persona: auditor
          version: 1.9.0
          advanced-security: false
          online-audits: false
          min-severity: high

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libpq-dev libsqlite3-dev libssl-dev libsodium-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ubuntu-24.04
          # Cache policy for every Rust job: only production pushes save, so the
          # quota holds caches that every PR and later run can restore, and a
          # failure in a later step still saves the compiled dependencies.
          save-if: ${{ github.ref == 'refs/heads/production' }}
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The integration job runs all workspace tests, including library tests.
      - run: cargo run --locked -p peppy-protocol --bin generate-contracts -- --check
      - run: cargo run --locked -p peppy-desktop-api --bin generate-search-contracts -- --check
      - run: cargo run --locked -p peppy-desktop-api --bin generate-attachment-retention-contracts -- --check
      - run: cargo run --locked -p peppy-hosted-api --bin export-web-schema -- --check
      - run: cargo run --locked -p peppy-hosted-api --bin generate-mcp-contracts -- --check
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check licenses bans sources
      - run: cargo deny check advisories
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 infra/audit/check-vendored.py

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    # Leave cold-cache headroom: workspace tests alone can take over 40 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libpq-dev libsqlite3-dev libssl-dev libsodium-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/production' && matrix.shard == 1 }}
          cache-on-failure: true
      - name: Install cargo-nextest
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash .github/scripts/install-cargo-nextest.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run workspace integration tests
        run: |
          bash infra/docker/test-seaweedfs-entrypoint.sh
          source infra/compose/test-env.sh
          cleanup() {
            status=$?
            peppy_test_compose logs --no-color || true
            peppy_test_infra_down || true
            exit "$status"
          }
          trap cleanup EXIT
          peppy_test_infra_up
          bash .github/scripts/run-rust-test-shard.sh workspace ${{ matrix.shard }} 4
          if [ '${{ matrix.shard }}' = 1 ]; then
            cargo test --workspace --locked --doc
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: node --test apps/desktop/scripts/generate-tray-icons.test.mjs
      - run: pnpm --filter @peppy/browser-runtime typecheck
      - run: pnpm --filter @peppy/browser-runtime test
      - run: pnpm --filter @peppy/desktop-ui test
      - run: pnpm --filter @peppy/desktop test
      - run: pnpm --filter @peppy/desktop build
      - run: pnpm --filter @peppy/web typecheck
      - run: pnpm --filter @peppy/web test
      - run: pnpm --filter @peppy/web build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-dist-${{ github.sha }}
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  desktop:
    needs: [changes, frontend]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
        fail-fast: false
        matrix:
          include: ${{ fromJSON(needs.changes.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    # Linux also runs ignored integration tests using the desktop build below.
    # All native platforms need cold-cache headroom for their Tauri dependencies.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-dist-${{ github.sha }}
          path: apps/desktop/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Remove preinstalled package-manager shims
        if: runner.os == 'Windows'
        run: npm uninstall --global yarn pnpm
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify committed tray icons
        if: runner.os == 'macOS'
        run: pnpm --filter @peppy/desktop icons:tray:check
      - name: Verify native installer artwork
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/installer-tests"
          "$RUNNER_TEMP/installer-tests/bin/python" -m pip install --require-hashes --only-binary=:all: -r packaging/macos/dmg/requirements.txt
          PYTHONPATH=packaging/macos/dmg "$RUNNER_TEMP/installer-tests/bin/python" -m unittest discover -s packaging/macos/dmg/tests
          python3 packaging/windows/installer/tests/test_installer_assets.py
      - name: Test Windows desktop development script
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/dev/windows-desktop.Tests.ps1
      - name: Test Windows loader diagnostics parser
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/windows-loader-diagnostics.Tests.ps1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libsqlite3-dev libssl-dev libsodium-dev libsecret-1-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - if: runner.os == 'Windows'
        name: Select native Windows Perl
        shell: pwsh
        run: |
          $perl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop).Source
          if ($perl -match '(?i)\\(?:Git\\usr|msys64\\usr)\\bin\\perl\.exe$') {
            $perl = 'C:\Strawberry\perl\bin\perl.exe'
            if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
              throw "Native Strawberry Perl was not found at $perl"
            }
          }
          $perl = (Resolve-Path -LiteralPath $perl).ProviderPath
          & $perl -MIPC::Cmd -e '1'
          if ($LASTEXITCODE -ne 0) {
            throw "Native Perl at $perl cannot load IPC::Cmd"
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install cargo-nextest
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash .github/scripts/install-cargo-nextest.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install cargo-nextest on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/bin" | Out-Null
          pwsh -NoProfile -File .github/scripts/install-cargo-nextest.ps1 "$env:RUNNER_TEMP/bin"
          "$env:RUNNER_TEMP/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test cargo-nextest installer on Windows
        if: runner.os == 'Windows' && matrix.index == 1
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/install-cargo-nextest.Tests.ps1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.os }}-desktop
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/production' && matrix.index == 1 }}
          cache-on-failure: true
      - if: matrix.index == 1
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: bash .github/scripts/run-rust-test-shard.sh desktop ${{ matrix.index }} ${{ matrix.count }}
      - name: Run desktop doctests
        if: matrix.index == 1
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --doc
      - name: Diagnose Windows loader failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem -LiteralPath apps/desktop/src-tauri/target/debug/deps -Filter 'peppy_desktop_lib-*.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $executable) {
            Write-Warning 'No peppy_desktop_lib test executable was available for loader diagnostics.'
            exit 0
          }
          try {
            & .github/scripts/windows-loader-diagnostics.ps1 -ExecutablePath $executable.FullName
          } catch {
            Write-Warning "Windows loader diagnostics could not complete: $($_.Exception.Message)"
          }
      - name: Run desktop integration tests with the existing build
        if: runner.os == 'Linux' && needs.changes.outputs.integration == 'true'
        shell: bash
        run: |
          bash infra/docker/test-seaweedfs-entrypoint.sh
          source infra/compose/test-env.sh
          cleanup() {
            status=$?
            peppy_test_compose logs --no-color || true
            peppy_test_infra_down || true
            exit "$status"
          }
          trap cleanup EXIT
          peppy_test_infra_up
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --ignored
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - if: matrix.index == 1
        run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml check licenses bans sources advisories

  desktop-updater:
    needs: [changes, frontend]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.desktop_os_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-dist-${{ github.sha }}
          path: apps/desktop/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libsqlite3-dev libssl-dev libsodium-dev libsecret-1-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - if: runner.os == 'Windows'
        name: Select native Windows Perl
        shell: pwsh
        run: |
          $perl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop).Source
          if ($perl -match '(?i)\\(?:Git\\usr|msys64\\usr)\\bin\\perl\.exe$') { $perl = 'C:\Strawberry\perl\bin\perl.exe' }
          $perl = (Resolve-Path -LiteralPath $perl).ProviderPath
          & $perl -MIPC::Cmd -e '1'
          if ($LASTEXITCODE -ne 0) { throw "Native Perl at $perl cannot load IPC::Cmd" }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.os }}-desktop
          workspaces: apps/desktop/src-tauri -> target
          save-if: false
          cache-on-failure: true
      - run: cargo check --locked --no-default-features --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: 'cargo test --locked --no-default-features --manifest-path apps/desktop/src-tauri/Cargo.toml --lib updates::'

  google-messages-go:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: apps/android/googlemessages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: ./prepare-libgm.sh
      - run: go test -race ./...
      - run: go test -race go.mau.fi/mautrix-gmessages/pkg/libgm
      - run: go vet ./...
      - run: go vet go.mau.fi/mautrix-gmessages/pkg/libgm
      - run: test -z "$(gofmt -l .)"

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/test-android.yml

  development-tools:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - name: Report development dependency advisories
        run: |
          if ! pnpm audit; then
            echo '::warning::Development dependency advisories detected; production dependency advisories remain blocking.'
          fi
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - run: node packages/mobile-design/scripts/generate.mjs --check
      - run: node packages/desktop-ui/scripts/avatar-palette.mjs --check
      - run: node --test packages/mobile-design/test/*.test.mjs
      - run: python3 tests/dev/run_parallel.py
      - run: bash -n infra/dev/dev.sh infra/dev/dev-smoke.sh infra/dev/copy-web-assets.sh infra/dev/container-run.sh infra/dev/android.sh infra/dev/android-container-run.sh infra/dev/desktop.sh infra/compose/verify-android-native.sh && shellcheck infra/dev/dev.sh infra/dev/dev-smoke.sh infra/dev/copy-web-assets.sh infra/dev/container-run.sh infra/dev/android.sh infra/dev/android-container-run.sh infra/dev/desktop.sh infra/compose/verify-android-native.sh
      - run: shellcheck .github/scripts/*.sh
      - run: bash .github/scripts/test-ci-scripts.sh
      - run: python3 .github/scripts/check-ci-scope-closure.py
      - run: just --list

  swift-bindings:
    needs: changes
    if: needs.changes.outputs.swift_bindings == 'true'
    # Serial native tests exercise the production 256 MiB KDF on hosted macOS runners.
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-15-swift-bindings
          save-if: ${{ github.ref == 'refs/heads/production' }}
          cache-on-failure: true
      - run: |
          cargo build -p peppy-mobile-bindings --locked
          cargo run --locked -p peppy-mobile-bindings --features cli --bin uniffi-bindgen -- generate --no-format --library target/debug/libpeppy_mobile_bindings.dylib --language swift --out-dir apps/ios/Generated
          cargo run --locked -p peppy-mobile-bindings --features cli --bin uniffi-bindgen -- generate --no-format --library target/debug/libpeppy_mobile_bindings.dylib --language kotlin --out-dir apps/android/app/src/main/java
          git diff --exit-code -- apps/ios/Generated apps/android/app/src/main/java/uniffi
          (cd apps/ios && DYLD_LIBRARY_PATH="$PWD/../../target/debug" swift test --no-parallel)
          (cd apps/ios && DYLD_LIBRARY_PATH="$PWD/../../target/debug" swift run PeppyMobileSmoke)

  development-artifacts:
    uses: ./.github/workflows/build-artifacts.yml
    needs: [changes, version]
    if: needs.changes.outputs.development_artifacts == 'true'
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      android_version: ${{ needs.version.outputs.android_version }}
      android_version_code: ${{ needs.version.outputs.android_version_code }}
      wix_version: ${{ needs.version.outputs.wix_version }}
      build_android: ${{ (github.event_name == 'push' && (needs.version.outputs.android_changed == 'true' || needs.version.outputs.android_budget_refresh == 'true')) || (github.event_name != 'push' && needs.changes.outputs.artifacts_android == 'true') }}
      build_desktop: ${{ needs.changes.outputs.artifacts_desktop == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/staging') }}
      build_ios: ${{ needs.changes.outputs.artifacts_ios == 'true' }}
      trusted_update_build: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
      update_channel: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'staging' || '' }}
    secrets:
      PEPPY_UPDATER_PRIVATE_KEY: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY }}
      PEPPY_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY_PASSWORD }}
      PEPPY_RELEASE_RPM_GPG_KEY: ${{ secrets.PEPPY_RELEASE_RPM_GPG_KEY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_MAS_CERTIFICATE_P12: ${{ secrets.APPLE_MAS_CERTIFICATE_P12 }}
      APPLE_MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
      APPLE_MAS_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
      APPLE_MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_MAS_SIGNING_IDENTITY: ${{ secrets.APPLE_MAS_SIGNING_IDENTITY }}
      APPLE_MAS_INSTALLER_IDENTITY: ${{ secrets.APPLE_MAS_INSTALLER_IDENTITY }}
      PEPPY_ANDROID_KEYSTORE_BASE64: ${{ secrets.PEPPY_ANDROID_KEYSTORE_BASE64 }}
      PEPPY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PEPPY_ANDROID_KEYSTORE_PASSWORD }}
      PEPPY_ANDROID_KEY_ALIAS: ${{ secrets.PEPPY_ANDROID_KEY_ALIAS }}
      PEPPY_ANDROID_KEY_PASSWORD: ${{ secrets.PEPPY_ANDROID_KEY_PASSWORD }}

  container-image:
    uses: ./.github/workflows/build-container.yml
    needs: [changes, version]
    if: needs.changes.outputs.container_image == 'true'
    with:
      version: ${{ needs.version.outputs.version }}

  gate:
    if: always()
    needs: [changes, source-audit, workflow-security, version, release-tooling, release-macos-tooling, development-tools, rust, integration, frontend, desktop, desktop-updater, android, google-messages-go, swift-bindings, container-image, development-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Evaluate CI gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_REQUIRED: 'true'
          SOURCE_AUDIT_RESULT: ${{ needs.source-audit.result }}
          SOURCE_AUDIT_REQUIRED: 'true'
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow-security.result }}
          WORKFLOW_SECURITY_REQUIRED: 'true'
          VERSION_RESULT: ${{ needs.version.result }}
          VERSION_REQUIRED: 'true'
          RELEASE_TOOLING_RESULT: ${{ needs.release-tooling.result }}
          RELEASE_TOOLING_REQUIRED: 'true'
          RELEASE_MACOS_TOOLING_RESULT: ${{ needs.release-macos-tooling.result }}
          RELEASE_MACOS_TOOLING_REQUIRED: 'true'
          DEVELOPMENT_TOOLS_RESULT: ${{ needs.development-tools.result }}
          DEVELOPMENT_TOOLS_REQUIRED: 'true'
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.integration }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          DESKTOP_UPDATER_RESULT: ${{ needs.desktop-updater.result }}
          DESKTOP_UPDATER_REQUIRED: ${{ needs.changes.outputs.desktop }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          GOOGLE_MESSAGES_GO_RESULT: ${{ needs.google-messages-go.result }}
          GOOGLE_MESSAGES_GO_REQUIRED: ${{ needs.changes.outputs.android }}
          SWIFT_BINDINGS_RESULT: ${{ needs.swift-bindings.result }}
          SWIFT_BINDINGS_REQUIRED: ${{ needs.changes.outputs.swift_bindings }}
          CONTAINER_IMAGE_RESULT: ${{ needs.container-image.result }}
          CONTAINER_IMAGE_REQUIRED: ${{ needs.changes.outputs.container_image }}
          DEVELOPMENT_ARTIFACTS_RESULT: ${{ needs.development-artifacts.result }}
          DEVELOPMENT_ARTIFACTS_REQUIRED: ${{ needs.changes.outputs.development_artifacts }}
        run: bash .github/scripts/ci-gate.sh

  publish-prerelease:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.gate.result == 'success' && needs.version.outputs.head_released != 'true' && needs.version.result == 'success'"
    needs: [version, gate]
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: staging
      sha: ${{ github.sha }}
      trusted_update_build: true
    secrets:
      PEPPY_UPDATER_PRIVATE_KEY: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY }}
      PEPPY_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY_PASSWORD }}
      PEPPY_RELEASE_GPG_KEY: ${{ secrets.PEPPY_RELEASE_GPG_KEY }}
      PEPPY_RELEASE_GPG_PASSPHRASE: ${{ secrets.PEPPY_RELEASE_GPG_PASSPHRASE }}
  publish-prerelease-android:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.gate.result == 'success' && needs.version.result == 'success' && needs.development-artifacts.result == 'success' && needs.publish-prerelease.result != 'failure' && needs.version.outputs.android_head_released != 'true' && (needs.version.outputs.android_changed == 'true' || needs.version.outputs.android_budget_refresh == 'true')"
    needs: [version, gate, development-artifacts, publish-prerelease]
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      component: android
      version: ${{ needs.version.outputs.android_version }}
      channel: staging
      sha: ${{ github.sha }}
      trusted_update_build: true
    secrets:
      PEPPY_RELEASE_GPG_KEY: ${{ secrets.PEPPY_RELEASE_GPG_KEY }}
      PEPPY_RELEASE_GPG_PASSPHRASE: ${{ secrets.PEPPY_RELEASE_GPG_PASSPHRASE }}
  publish-staging-server:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.gate.result == 'success'"
    needs: gate
    uses: ./.github/workflows/publish-community-image.yml
    with:
      image: hub.docker.visnovsky.us/library/peppy-server
      context: .
      dockerfile: infra/docker/server.Dockerfile
      tag: staging
      environment: staging
      sha: ${{ github.sha }}
    secrets: inherit
  publish-staging-relay:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.gate.result == 'success'"
    needs: gate
    uses: ./.github/workflows/publish-community-image.yml
    with:
      image: hub.docker.visnovsky.us/library/peppy-push-relay
      context: .
      dockerfile: infra/docker/push-relay.Dockerfile
      tag: staging
      environment: staging
      sha: ${{ github.sha }}
    secrets: inherit
  publish-staging-mcp:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.gate.result == 'success'"
    needs: gate
    uses: ./.github/workflows/publish-community-image.yml
    with:
      image: hub.docker.visnovsky.us/library/peppy-mcp
      context: .
      dockerfile: infra/docker/mcp.Dockerfile
      tag: staging
      environment: staging
      sha: ${{ github.sha }}
    secrets: inherit
  publish-production-server:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/production' && needs.gate.result == 'success'"
    needs: gate
    uses: ./.github/workflows/publish-community-image.yml
    with:
      image: hub.docker.visnovsky.us/library/peppy-server
      context: .
      dockerfile: infra/docker/server.Dockerfile
      tag: edge
      environment: production
      sha: ${{ github.sha }}
    secrets: inherit
  publish-production-relay:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/production' && needs.gate.result == 'success'"
    needs: gate
    uses: ./.github/workflows/publish-community-image.yml
    with:
      image: hub.docker.visnovsky.us/library/peppy-push-relay
      context: .
      dockerfile: infra/docker/push-relay.Dockerfile
      tag: edge
      environment: production
      sha: ${{ github.sha }}
    secrets: inherit
  publish-production-mcp:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/production' && needs.gate.result == 'success'"
    needs: gate
    uses: ./.github/workflows/publish-community-image.yml
    with:
      image: hub.docker.visnovsky.us/library/peppy-mcp
      context: .
      dockerfile: infra/docker/mcp.Dockerfile
      tag: edge
      environment: production
      sha: ${{ github.sha }}
    secrets: inherit
  notify-hosted-production:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/production' && needs.gate.result == 'success' && needs.publish-production-server.result == 'success' && needs.publish-production-relay.result == 'success' && needs.publish-production-mcp.result == 'success'"
    needs: [gate, publish-production-server, publish-production-relay, publish-production-mcp]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment: production
    steps:
      - name: Check out dispatched source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch hosted production workflow
        env:
          PEPPY_PLATFORM_DISPATCH_TOKEN: ${{ secrets.PEPPY_PLATFORM_DISPATCH_TOKEN }}
          SOURCE_REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_DIGEST: ${{ needs.publish-production-server.outputs.digest }}
          RELAY_DIGEST: ${{ needs.publish-production-relay.outputs.digest }}
        run: bash .github/scripts/notify-hosted-production.sh
  stable-release:
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/production' && needs.gate.result == 'success' && needs.version.outputs.head_released != 'true' && needs.version.result == 'success' && needs.publish-production-server.result == 'success' && needs.publish-production-relay.result == 'success' && needs.publish-production-mcp.result == 'success'"
    needs: [gate, version, publish-production-server, publish-production-relay, publish-production-mcp]
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    concurrency:
      group: stable-release
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      bump: auto
      version: ''
      dry_run: false
    secrets: inherit
