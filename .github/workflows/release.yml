name: Release

on:
  workflow_call:
    inputs:
      bump:
        required: false
        type: string
        default: auto
      version:
        required: false
        type: string
        default: ''
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Reusable calls inherit the caller event; only dispatches own this lock.
  group: ${{ github.event_name == 'workflow_dispatch' && 'stable-release' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      android_version_code: ${{ steps.compute.outputs.android_version_code }}
      wix_version: ${{ steps.compute.outputs.wix_version }}
      sha: ${{ steps.target.outputs.sha }}
      skip: ${{ steps.target.outputs.skip == 'true' || steps.compute.outputs.skip == 'true' }}
    steps:
      - name: Require production release event before checkout
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:refs/heads/production|push:refs/heads/production) ;;
            *) echo 'stable releases require a production dispatch or push' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require trusted stable release context
        env:
          CHANNEL: stable
        run: REQUESTED_SHA="$(git rev-parse HEAD)" bash .github/scripts/release-context-guard.sh
      - id: target
        run: |
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            production_sha=$(git ls-remote origin refs/heads/production | awk '{print $1}')
            if [ "$GITHUB_SHA" != "$production_sha" ]; then
              echo '::notice::A newer production commit exists; skipping stale automatic release'
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'skip=false' >> "$GITHUB_OUTPUT"
      - name: Require green CI
        if: steps.target.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          green=false
          run_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push" --paginate --jq '.workflow_runs[].id')
          for run_id in $run_ids; do
            gate=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" --paginate --jq '.jobs[] | select(.name == "gate" and .conclusion == "success") | .id')
            if [ -n "$gate" ]; then
              green=true
              break
            fi
          done
          if [ "$green" != true ]; then
            if [ "$DRY_RUN" = true ]; then
              echo '::warning::No CI push run with a successful gate exists for this SHA'
            else
              echo '::error::No CI push run with a successful gate exists for this SHA'
              exit 1
            fi
          fi
      - if: steps.target.outputs.skip != 'true'
        run: infra/release/install-git-cliff.sh "$RUNNER_TEMP/bin"
      - if: steps.target.outputs.skip != 'true'
        run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: compute
        if: steps.target.outputs.skip != 'true'
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          args=(--channel stable)
          if [ -n "$VERSION_INPUT" ]; then args+=(--version "$VERSION_INPUT"); else args+=(--bump "$BUMP"); fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$BUMP" = auto ] && [ -z "$VERSION_INPUT" ]; then args+=(--allow-auto-patch-fallback); fi
          set +e
          output=$(infra/release/compute-version.sh "${args[@]}")
          status=$?
          set -e
          if [ "$status" -eq 4 ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            echo '::notice::This production SHA already has a stable release; skipping duplicate automatic release'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
          printf '%s\n' "$output" | tee -a "$GITHUB_OUTPUT"
          echo 'skip=false' >> "$GITHUB_OUTPUT"
      - name: Reject stable version below published prereleases
        if: steps.target.outputs.skip != 'true' && steps.compute.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          if ! message=$(bash infra/release/check-stable-prerelease-floor.sh 2>&1); then
            if [ "$DRY_RUN" = true ]; then echo "::warning::$message"; else echo "::error::$message"; exit 1; fi
          fi
      # This summary is deliberately skipped for stale or duplicate auto runs.
      - name: Summarize release preparation
        if: steps.target.outputs.skip != 'true' && steps.compute.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ steps.target.outputs.sha }}
          VERSION: ${{ steps.compute.outputs.version }}
          LAST_STABLE: ${{ steps.compute.outputs.last_stable }}
          BUMP: ${{ steps.compute.outputs.bump }}
        run: |
          printf '## Release preparation\n\n- Version: %s\n- Last stable: %s\n- Bump: %s\n- SHA: %s\n- Dry run: %s\n' "$VERSION" "$LAST_STABLE" "$BUMP" "$SHA" "$DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
  signing:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: updates-stable
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: readiness
        env:
          PEPPY_UPDATER_PRIVATE_KEY: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY }}
          PEPPY_UPDATE_PUBLIC_KEY: ${{ vars.PEPPY_UPDATE_PUBLIC_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PEPPY_RELEASE_RPM_GPG_KEY: ${{ secrets.PEPPY_RELEASE_RPM_GPG_KEY }}
          PEPPY_RELEASE_RPM_GPG_KEY_ID: ${{ vars.PEPPY_RELEASE_RPM_GPG_KEY_ID }}
          PEPPY_RELEASE_GPG_KEY: ${{ secrets.PEPPY_RELEASE_GPG_KEY }}
          PEPPY_RELEASE_GPG_KEY_ID: ${{ vars.PEPPY_RELEASE_GPG_KEY_ID }}
          PEPPY_MACOS_SIGNING_MODE: ${{ vars.PEPPY_MACOS_SIGNING_MODE || 'developer-id' }}
          PEPPY_WINDOWS_SIGNING_MODE: ${{ vars.PEPPY_WINDOWS_SIGNING_MODE || 'authenticode' }}
        run: bash .github/scripts/release-signing-readiness.sh
  artifacts:
    needs: [prepare, signing]
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' && needs.signing.outputs.ready == 'true' }}
    uses: ./.github/workflows/build-artifacts.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      android_version_code: ${{ needs.prepare.outputs.android_version_code }}
      wix_version: ${{ needs.prepare.outputs.wix_version }}
      trusted_update_build: true
      update_channel: stable
    secrets:
      PEPPY_UPDATER_PRIVATE_KEY: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY }}
      PEPPY_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY_PASSWORD }}
      PEPPY_RELEASE_RPM_GPG_KEY: ${{ secrets.PEPPY_RELEASE_RPM_GPG_KEY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PEPPY_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ secrets.PEPPY_DESKTOP_GOOGLE_CLIENT_SECRET }}
  publish:
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.skip != 'true' && needs.signing.outputs.ready == 'true' && needs.artifacts.result == 'success' && needs.publish-server-image.result == 'success' && needs.publish-relay-image.result == 'success' }}
    needs: [prepare, signing, artifacts, publish-server-image, publish-relay-image]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: stable
      sha: ${{ needs.prepare.outputs.sha }}
      trusted_update_build: true
    secrets:
      PEPPY_UPDATER_PRIVATE_KEY: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY }}
      PEPPY_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.PEPPY_UPDATER_PRIVATE_KEY_PASSWORD }}
      PEPPY_RELEASE_GPG_KEY: ${{ secrets.PEPPY_RELEASE_GPG_KEY }}
      PEPPY_RELEASE_GPG_PASSPHRASE: ${{ secrets.PEPPY_RELEASE_GPG_PASSPHRASE }}
  publish-server-image:
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.skip != 'true' && needs.signing.outputs.ready == 'true' && needs.artifacts.result == 'success' }}
    needs: [prepare, signing, artifacts]
    uses: ./.github/workflows/publish-community-image.yml
    with:
      image: hub.docker.visnovsky.us/library/peppy-server
      context: .
      dockerfile: infra/docker/server.Dockerfile
      tag: ${{ needs.prepare.outputs.version }}
      environment: production
      sha: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
  publish-relay-image:
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.skip != 'true' && needs.signing.outputs.ready == 'true' && needs.artifacts.result == 'success' }}
    needs: [prepare, signing, artifacts]
    uses: ./.github/workflows/publish-community-image.yml
    with:
      image: hub.docker.visnovsky.us/library/peppy-push-relay
      context: .
      dockerfile: infra/docker/push-relay.Dockerfile
      tag: ${{ needs.prepare.outputs.version }}
      environment: production
      sha: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
