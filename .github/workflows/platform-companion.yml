name: Platform companion

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no PR checkout; numeric input only
    types: [opened, synchronize, reopened, closed, edited, labeled, unlabeled]
    branches: [production]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash .github/scripts/notify-platform-companion.sh
        env:
          GH_TOKEN: ${{ secrets.PEPPY_AUTOMATION_TOKEN }}
          PUBLIC_PR: ${{ github.event.pull_request.number }}
