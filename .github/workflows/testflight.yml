name: TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plain desktop release version
        required: true
        type: string
      ref:
        description: Release commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-number:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.number.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: number
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/production ]] || { echo 'TestFlight requires production' >&2; exit 1; }
          [[ "$REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'ref must be a 40-hex SHA' >&2; exit 1; }
          number=$(bash infra/release/macos-build-number.sh "$VERSION")
          tag_sha=$(git rev-parse --verify "refs/tags/v${VERSION}^{commit}") || { echo "release tag v${VERSION} not found" >&2; exit 1; }
          [[ "$tag_sha" == "$(printf '%s' "$REF" | tr 'A-F' 'a-f')" ]] || { echo "release tag v${VERSION} does not match ref" >&2; exit 1; }
          echo "value=$number" >> "$GITHUB_OUTPUT"
  app-store-artifacts:
    needs: build-number
    uses: ./.github/workflows/build-artifacts.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      macos_build_number: ${{ needs.build-number.outputs.number }}
      macos_distribution: app-store
      build_desktop: true
      build_android: false
      build_ios: false
    secrets:
      APPLE_MAS_CERTIFICATE_P12: ${{ secrets.APPLE_MAS_CERTIFICATE_P12 }}
      APPLE_MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
      APPLE_MAS_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
      APPLE_MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_MAS_SIGNING_IDENTITY: ${{ secrets.APPLE_MAS_SIGNING_IDENTITY }}
      APPLE_MAS_INSTALLER_IDENTITY: ${{ secrets.APPLE_MAS_INSTALLER_IDENTITY }}
  testflight-upload:
    needs: [build-number, app-store-artifacts]
    runs-on: macos-26
    timeout-minutes: 70
    environment: mac-app-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-macos-development-artifacts
          path: dist/app-store
      - name: Upload to TestFlight
        shell: bash
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ needs.build-number.outputs.number }}
        run: |
          shopt -s nullglob
          packages=(dist/app-store/*.pkg)
          [ "${#packages[@]}" -eq 1 ] || { echo 'expected exactly one App Store package' >&2; exit 1; }
          bash infra/release/upload-testflight.sh "${packages[0]}" "$VERSION" "$BUILD_NUMBER"
