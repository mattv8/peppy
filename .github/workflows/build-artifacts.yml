name: Development artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      version:
        description: Version to stamp into artifacts
        required: false
        type: string
        default: ''
      android_version:
        description: Android version to stamp into artifacts
        required: false
        type: string
        default: ''
      build_android:
        description: Build Android artifacts
        required: false
        type: boolean
        default: true
      build_desktop:
        description: Build desktop artifacts
        required: false
        type: boolean
        default: true
      build_ios:
        description: Build iOS artifacts
        required: false
        type: boolean
        default: true
      android_version_code:
        description: Android version code to stamp into artifacts
        required: false
        type: string
        default: ''
      wix_version:
        description: WiX version to stamp into Windows artifacts
        required: false
        type: string
        default: ''
      android_firebase_app_config:
        description: Public Firebase Android app configuration JSON for the official Android artifact
        required: false
        type: string
        default: ''
      trusted_update_build:
        description: Build signed updater artifacts from a protected release caller
        required: false
        type: boolean
        default: false
      update_channel:
        description: Trusted updater channel
        required: false
        type: string
        default: ''
      macos_distribution:
        description: macOS package distribution (direct or app-store)
        required: false
        type: string
        default: direct
    secrets:
      PEPPY_UPDATER_PRIVATE_KEY:
        required: false
      PEPPY_UPDATER_PRIVATE_KEY_PASSWORD:
        required: false
      PEPPY_RELEASE_RPM_GPG_KEY:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_MAS_CERTIFICATE_P12:
        required: false
      APPLE_MAS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_MAS_INSTALLER_CERTIFICATE:
        required: false
      APPLE_MAS_PROVISIONING_PROFILE_BASE64:
        required: false
      APPLE_MAS_SIGNING_IDENTITY:
        required: false
      APPLE_MAS_INSTALLER_IDENTITY:
        required: false
      PEPPY_ANDROID_KEYSTORE_BASE64:
        required: false
      PEPPY_ANDROID_KEYSTORE_PASSWORD:
        required: false
      PEPPY_ANDROID_KEY_ALIAS:
        required: false
      PEPPY_ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: production
        type: string
      version:
        description: Version to stamp into artifacts
        required: false
        type: string
        default: ''
      android_version:
        description: Android version to stamp into artifacts
        required: false
        type: string
        default: ''
      build_android:
        description: Build Android artifacts
        required: false
        type: boolean
        default: true
      build_desktop:
        description: Build desktop artifacts
        required: false
        type: boolean
        default: true
      build_ios:
        description: Build iOS artifacts
        required: false
        type: boolean
        default: true
      android_version_code:
        description: Android version code to stamp into artifacts
        required: false
        type: string
        default: ''
      wix_version:
        description: WiX version to stamp into Windows artifacts
        required: false
        type: string
        default: ''
      macos_build_number:
        description: Mac App Store CFBundleVersion; required for app-store builds, unique and increasing per app record
        required: false
        type: string
        default: ''
      android_firebase_app_config:
        description: Public Firebase Android app configuration JSON for the official Android artifact
        required: false
        type: string
        default: ''
      macos_distribution:
        description: macOS package distribution
        required: false
        type: choice
        options: [direct, app-store]
        default: direct

permissions:
  contents: read

jobs:
  android-development-artifacts:
    if: inputs.build_android != false
    environment: "${{ inputs.trusted_update_build && format('updates-{0}', inputs.update_channel) || 'development-artifacts' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reject untrusted Android build context
        if: inputs.trusted_update_build
        shell: bash
        env:
          CHANNEL: ${{ inputs.update_channel }}
          REQUESTED_REF: ${{ inputs.ref }}
          BUILD_DESKTOP: ${{ inputs.build_desktop }}
        run: |
          [ "$REQUESTED_REF" = "$GITHUB_SHA" ] || { echo 'trusted Android build ref must equal the triggering SHA' >&2; exit 1; }
          [ "$BUILD_DESKTOP" != false ] || { echo 'trusted Android builds must include desktop artifacts' >&2; exit 1; }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF:$CHANNEL" in
            workflow_dispatch:refs/heads/production:stable|push:refs/heads/production:stable|push:refs/heads/staging:staging) ;;
            *) echo 'trusted Android builds require a production stable dispatch/push or staging push' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out trusted Android context
        if: inputs.trusted_update_build
        shell: bash
        env:
          CHANNEL: ${{ inputs.update_channel }}
          REQUESTED_SHA: ${{ inputs.ref }}
        run: bash .github/scripts/release-context-guard.sh
      - name: Validate protected Android signing inputs
        if: inputs.trusted_update_build
        shell: bash
        env:
          PEPPY_ANDROID_KEYSTORE_BASE64: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEYSTORE_BASE64 || '' }}
          PEPPY_ANDROID_KEYSTORE_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEYSTORE_PASSWORD || '' }}
          PEPPY_ANDROID_KEY_ALIAS: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEY_ALIAS || '' }}
          PEPPY_ANDROID_KEY_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEY_PASSWORD || '' }}
          PEPPY_ANDROID_SIGNING_CERT_SHA256: ${{ inputs.trusted_update_build && vars.PEPPY_ANDROID_SIGNING_CERT_SHA256 || '' }}
        run: |
          for input in PEPPY_ANDROID_KEYSTORE_BASE64 PEPPY_ANDROID_KEYSTORE_PASSWORD PEPPY_ANDROID_KEY_ALIAS PEPPY_ANDROID_KEY_PASSWORD PEPPY_ANDROID_SIGNING_CERT_SHA256; do
            [ -n "${!input}" ] || { echo "missing protected Android signing input: $input" >&2; exit 1; }
          done
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Restore Android Rust release dependency cache
        id: android-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/.fingerprint
            target/debug/build
            target/release/deps
            target/release/.fingerprint
            target/release/build
            target/aarch64-linux-android/release/deps
            target/aarch64-linux-android/release/.fingerprint
            target/aarch64-linux-android/release/build
            target/x86_64-linux-android/release/deps
            target/x86_64-linux-android/release/.fingerprint
            target/x86_64-linux-android/release/build
          key: rust-android-artifacts-${{ runner.os }}-${{ runner.arch }}-1.98.1-host-debug-cross-release-mobile-bindings-default-ndk-27.2.12479018-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mobile-bindings/Cargo.toml') }}
      - name: Restore Android Gradle cache
        id: android-gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-artifacts-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle.properties', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/verification-metadata.xml') }}
      - run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libssl-dev libsodium-dev
      - name: Install Android NDK
        run: |
          set +e
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.2.12479018"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"
      - name: Build Google Messages AAR
        if: inputs.trusted_update_build && vars.PEPPY_GOOGLE_MESSAGES_LICENSE_SIGNOFF != ''
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          apps/android/googlemessages/build-aar.sh
          apps/android/googlemessages/check-licenses.sh
      - name: Install verified bundletool
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
      - name: Test Firebase Android app configuration validation
        run: node --test infra/build/validate-firebase-app-config.test.mjs
      - name: Configure optional Firebase Android app
        env:
          PEPPY_ANDROID_FIREBASE_APP_CONFIG: ${{ inputs.android_firebase_app_config || vars.PEPPY_ANDROID_FIREBASE_APP_CONFIG }}
        run: node infra/build/validate-firebase-app-config.mjs
      - name: Build trusted Android release artifacts
        if: inputs.trusted_update_build
        env:
          VERSION: ${{ inputs.android_version || inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID }}
          PEPPY_ANDROID_NATIVE_PROFILE: release
          PEPPY_GOOGLE_MESSAGES_LICENSE_SIGNOFF: ${{ vars.PEPPY_GOOGLE_MESSAGES_LICENSE_SIGNOFF }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          infra/compose/verify-android-native.sh
          cd apps/android
          gradle_args=()
          if [[ -n "$VERSION" || -n "$ANDROID_VERSION_CODE" ]]; then
            if [[ -z "$VERSION" || -z "$ANDROID_VERSION_CODE" ]]; then
              echo "version and android_version_code must both be set" >&2
              exit 1
            fi
            gradle_args+=("-PpeppyVersionName=$VERSION" "-PpeppyVersionCode=$ANDROID_VERSION_CODE")
          fi
          mkdir -p ../../dist/android-release
          google_messages_link_args=()
          if [[ -n "$PEPPY_GOOGLE_MESSAGES_LICENSE_SIGNOFF" ]]; then
            google_messages_link_args+=('-PpeppyGoogleMessagesLink=true')
          fi
          ./gradlew --console=plain --dependency-verification=strict --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' --max-workers=2 :app:verifyReleaseManifestSecurity :app:lintSideload :app:assembleSideload :app:verifySideloadGoogleMessagesLink -PpeppyDistribution=direct "${gradle_args[@]}" "${google_messages_link_args[@]}"
          install -m 0644 app/build/outputs/apk/sideload/app-sideload-unsigned.apk ../../dist/android-release/peppy-android-unsigned.apk
          ./gradlew --console=plain --dependency-verification=strict --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' --max-workers=2 :app:verifyReleaseManifestSecurity :app:lintRelease :app:bundleRelease :app:mergeReleaseNativeDebugMetadata -PpeppyDistribution=play "${gradle_args[@]}"
          install -m 0644 app/build/outputs/bundle/release/app-release.aab ../../dist/android-release/peppy-android-unsigned.aab
          install -m 0644 app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip ../../dist/android-release/peppy-android-native-debug-symbols.zip
      - name: Stop Android Gradle daemon before signing
        if: inputs.trusted_update_build
        working-directory: apps/android
        run: ./gradlew --stop
      - name: Sign trusted Android release artifacts
        if: inputs.trusted_update_build
        env:
          PEPPY_ANDROID_KEYSTORE_BASE64: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEYSTORE_BASE64 || '' }}
          PEPPY_ANDROID_KEYSTORE_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEYSTORE_PASSWORD || '' }}
          PEPPY_ANDROID_KEY_ALIAS: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEY_ALIAS || '' }}
          PEPPY_ANDROID_KEY_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEY_PASSWORD || '' }}
          PEPPY_ANDROID_SIGNING_CERT_SHA256: ${{ inputs.trusted_update_build && vars.PEPPY_ANDROID_SIGNING_CERT_SHA256 || '' }}
        run: bash infra/release/sign-android-artifacts.sh dist/android-release/peppy-android-unsigned.apk dist/android-release/peppy-android-unsigned.aab dist/android-release
      - name: Verify trusted Android distribution metadata and symbols
        if: inputs.trusted_update_build
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          PEPPY_GOOGLE_MESSAGES_LINK_EXPECTED: ${{ vars.PEPPY_GOOGLE_MESSAGES_LICENSE_SIGNOFF != '' && 'true' || 'false' }}
        run: |
          export LLVM_NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          bash infra/release/verify-android-distribution.sh dist/android-release/peppy-android.apk dist/android-release/peppy-android.aab dist/android-release/peppy-android-native-debug-symbols.zip
      - name: Build development Android debug APK
        if: ${{ !inputs.trusted_update_build }}
        env:
          VERSION: ${{ inputs.android_version || inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID }}
          PEPPY_ANDROID_NATIVE_PROFILE: release
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          infra/compose/verify-android-native.sh
          cd apps/android
          if [[ -n "$VERSION" || -n "$ANDROID_VERSION_CODE" ]]; then
            if [[ -z "$VERSION" || -z "$ANDROID_VERSION_CODE" ]]; then
              echo "version and android_version_code must both be set" >&2
              exit 1
            fi
            ./gradlew --dependency-verification=strict :app:verifyReleaseManifestSecurity :app:assembleDebug :app:assembleSideload :app:verifySideloadGoogleMessagesLink -PpeppyDistribution=direct "-PpeppyVersionName=$VERSION" "-PpeppyVersionCode=$ANDROID_VERSION_CODE"
            ./gradlew --dependency-verification=strict :app:bundleRelease -PpeppyDistribution=play "-PpeppyVersionName=$VERSION" "-PpeppyVersionCode=$ANDROID_VERSION_CODE"
          else
            ./gradlew --dependency-verification=strict :app:verifyReleaseManifestSecurity :app:assembleDebug :app:assembleSideload :app:verifySideloadGoogleMessagesLink -PpeppyDistribution=direct
            ./gradlew --dependency-verification=strict :app:bundleRelease -PpeppyDistribution=play
          fi
          mkdir -p ../../dist/android-release
          install -m 0644 app/build/outputs/apk/debug/app-debug.apk ../../dist/android-release/peppy-android-debug.apk
      - name: Stop Android Gradle daemon before caching
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/production' && steps.android-gradle-cache.outputs.cache-hit != 'true' }}
        working-directory: apps/android
        run: ./gradlew --stop
      - name: Save Android Rust release dependency cache
        id: android-rust-cache-save
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/production' && steps.android-rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/.fingerprint
            target/debug/build
            target/release/deps
            target/release/.fingerprint
            target/release/build
            target/aarch64-linux-android/release/deps
            target/aarch64-linux-android/release/.fingerprint
            target/aarch64-linux-android/release/build
            target/x86_64-linux-android/release/deps
            target/x86_64-linux-android/release/.fingerprint
            target/x86_64-linux-android/release/build
          key: rust-android-artifacts-${{ runner.os }}-${{ runner.arch }}-1.98.1-host-debug-cross-release-mobile-bindings-default-ndk-27.2.12479018-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mobile-bindings/Cargo.toml') }}
      - name: Save Android Gradle cache
        id: android-gradle-cache-save
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/production' && steps.android-gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-artifacts-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle.properties', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/verification-metadata.xml') }}
      - if: inputs.trusted_update_build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-release-artifacts
          path: |
            dist/android-release/peppy-android.apk
            dist/android-release/peppy-android.aab
            dist/android-release/peppy-android-native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - if: ${{ !inputs.trusted_update_build }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-development-artifacts
          path: dist/android-release/peppy-android-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  desktop-development-artifacts:
    if: inputs.build_desktop != false
    environment: "${{ inputs.macos_distribution == 'app-store' && 'mac-app-store' || inputs.trusted_update_build && format('updates-{0}', inputs.update_channel) || 'development-artifacts' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            bundles: appimage,deb,rpm
            posix_bundles: appimage deb rpm
            path: dist/desktop-linux-bundles.tar.gz
          - os: macos-26
            name: macos
            bundles: app,dmg
            posix_bundles: macos
            path: |
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              dist/desktop-macos-app.tar.gz
          - os: windows-2025
            name: windows
            bundles: nsis,msi
            path: |
              apps/desktop/src-tauri/target/release/bundle/nsis/**
              apps/desktop/src-tauri/target/release/bundle/msi/**
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Reject untrusted updater build context
        if: inputs.trusted_update_build
        shell: bash
        env:
          CHANNEL: ${{ inputs.update_channel }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          [ "$REQUESTED_REF" = "$GITHUB_SHA" ] || { echo 'trusted updater build ref must equal the triggering SHA' >&2; exit 1; }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF:$CHANNEL" in
            workflow_dispatch:refs/heads/production:stable|push:refs/heads/production:stable|push:refs/heads/staging:staging) ;;
            *) echo 'trusted updater builds require a production stable dispatch/push or staging push' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out trusted updater context
        if: inputs.trusted_update_build
        shell: bash
        env:
          CHANNEL: ${{ inputs.update_channel }}
          REQUESTED_SHA: ${{ inputs.ref }}
        run: bash .github/scripts/release-context-guard.sh
      - name: Validate protected signing policy
        if: inputs.trusted_update_build
        shell: bash
        env:
          PEPPY_MACOS_SIGNING_MODE: ${{ vars.PEPPY_MACOS_SIGNING_MODE || 'developer-id' }}
          PEPPY_WINDOWS_SIGNING_MODE: ${{ vars.PEPPY_WINDOWS_SIGNING_MODE || 'authenticode' }}
          PEPPY_MACOS_DISTRIBUTION: ${{ inputs.macos_distribution || 'direct' }}
        run: bash .github/scripts/release-signing-readiness.sh --validate-modes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - name: Restore desktop Rust release dependency cache
        id: desktop-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/desktop/src-tauri/target/release/deps
            apps/desktop/src-tauri/target/release/.fingerprint
            apps/desktop/src-tauri/target/release/build
          key: rust-desktop-artifacts-${{ matrix.name }}-${{ runner.arch }}-1.98.1-release-default-self-update-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
      - name: Remove preinstalled package-manager shims
        if: runner.os == 'Windows'
        run: npm uninstall --global yarn pnpm
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libsqlite3-dev libssl-dev libsodium-dev libsecret-1-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev rpm
      - if: runner.os == 'Linux' && inputs.trusted_update_build
        name: Install pinned RPM metadata tool
        shell: bash
        run: |
          infra/release/install-rpmrebuild.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        name: Select native Windows Perl
        shell: pwsh
        run: |
          $perl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop).Source
          if ($perl -match '(?i)\\(?:Git\\usr|msys64\\usr)\\bin\\perl\.exe$') {
            $perl = 'C:\Strawberry\perl\bin\perl.exe'
            if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
              throw "Native Strawberry Perl was not found at $perl"
            }
          }
          $perl = (Resolve-Path -LiteralPath $perl).ProviderPath
          & $perl -MIPC::Cmd -e '1'
          if ($LASTEXITCODE -ne 0) {
            throw "Native Perl at $perl cannot load IPC::Cmd"
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - if: runner.os == 'Windows' && inputs.trusted_update_build && vars.PEPPY_WINDOWS_SIGNING_MODE != 'none'
        name: Import protected Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ inputs.trusted_update_build && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.trusted_update_build && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'Windows Authenticode certificate inputs are required for trusted builds' }
          $path = Join-Path $env:RUNNER_TEMP 'peppy-authenticode.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $path -Force
          "PEPPY_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Tauri bundles
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          VERSION: ${{ inputs.version }}
          WIX_VERSION: ${{ inputs.wix_version }}
          MACOS_BUILD_NUMBER: ${{ inputs.macos_build_number }}
          TRUSTED_UPDATE_BUILD: ${{ inputs.trusted_update_build }}
          PEPPY_UPDATE_CHANNEL: ${{ inputs.update_channel }}
          PEPPY_UPDATE_PUBLIC_KEY: ${{ inputs.trusted_update_build && vars.PEPPY_UPDATE_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.trusted_update_build && secrets.PEPPY_UPDATER_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_UPDATER_PRIVATE_KEY_PASSWORD || '' }}
          PEPPY_MACOS_SIGNING_MODE: ${{ inputs.trusted_update_build && (vars.PEPPY_MACOS_SIGNING_MODE || 'developer-id') || '' }}
          PEPPY_WINDOWS_SIGNING_MODE: ${{ inputs.trusted_update_build && (vars.PEPPY_WINDOWS_SIGNING_MODE || 'authenticode') || '' }}
          APPLE_CERTIFICATE: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          PEPPY_MACOS_DISTRIBUTION: ${{ inputs.macos_distribution || 'direct' }}
          APPLE_MAS_CERTIFICATE_P12: ${{ inputs.macos_distribution == 'app-store' && runner.os == 'macOS' && secrets.APPLE_MAS_CERTIFICATE_P12 || '' }}
          APPLE_MAS_CERTIFICATE_PASSWORD: ${{ inputs.macos_distribution == 'app-store' && runner.os == 'macOS' && secrets.APPLE_MAS_CERTIFICATE_PASSWORD || '' }}
          APPLE_MAS_INSTALLER_CERTIFICATE: ${{ inputs.macos_distribution == 'app-store' && runner.os == 'macOS' && secrets.APPLE_MAS_INSTALLER_CERTIFICATE || '' }}
          APPLE_MAS_PROVISIONING_PROFILE_BASE64: ${{ inputs.macos_distribution == 'app-store' && runner.os == 'macOS' && secrets.APPLE_MAS_PROVISIONING_PROFILE_BASE64 || '' }}
          APPLE_MAS_SIGNING_IDENTITY: ${{ inputs.macos_distribution == 'app-store' && runner.os == 'macOS' && secrets.APPLE_MAS_SIGNING_IDENTITY || '' }}
          APPLE_MAS_INSTALLER_IDENTITY: ${{ inputs.macos_distribution == 'app-store' && runner.os == 'macOS' && secrets.APPLE_MAS_INSTALLER_IDENTITY || '' }}
        run: infra/release/build-desktop-bundles.sh
      - if: always() && runner.os == 'Windows' && inputs.trusted_update_build && vars.PEPPY_WINDOWS_SIGNING_MODE != 'none'
        name: Remove protected Authenticode certificate
        shell: pwsh
        run: |
          if ($env:PEPPY_WINDOWS_CERT_THUMBPRINT) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:PEPPY_WINDOWS_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue }
      - if: runner.os == 'Linux' && inputs.trusted_update_build
        name: Normalize and sign trusted Linux package metadata
        env:
          CANONICAL_VERSION: ${{ inputs.version }}
          PEPPY_RELEASE_RPM_GPG_KEY: ${{ inputs.trusted_update_build && secrets.PEPPY_RELEASE_RPM_GPG_KEY || '' }}
          PEPPY_RELEASE_RPM_GPG_KEY_ID: ${{ inputs.trusted_update_build && vars.PEPPY_RELEASE_RPM_GPG_KEY_ID || '' }}
        run: |
          infra/release/normalize-linux-package-metadata.sh "$CANONICAL_VERSION" apps/desktop/src-tauri/target/release/bundle
          infra/release/sign-rpm.sh apps/desktop/src-tauri/target/release/bundle/rpm
      - if: runner.os == 'Linux'
        name: Preserve POSIX bundle permissions
        shell: bash
        run: |
          mkdir -p dist
          tar -C apps/desktop/src-tauri/target/release/bundle \
             -czf "dist/desktop-${{ matrix.name }}-bundles.tar.gz" ${{ matrix.posix_bundles }}
      - if: runner.os == 'macOS'
        name: Preserve development macOS app archive
        shell: bash
        run: |
          mkdir -p dist
          archive="$PWD/dist/desktop-macos-app.tar.gz"
          (
            cd apps/desktop/src-tauri/target/release/bundle/macos
            tar -czf "$archive" -- *.app
          )
      - name: Save desktop Rust release dependency cache
        id: desktop-rust-cache-save
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/production' && steps.desktop-rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/desktop/src-tauri/target/release/deps
            apps/desktop/src-tauri/target/release/.fingerprint
            apps/desktop/src-tauri/target/release/build
          key: rust-desktop-artifacts-${{ matrix.name }}-${{ runner.arch }}-1.98.1-release-default-self-update-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.name }}-${{ inputs.trusted_update_build && 'release' || 'development' }}-artifacts
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios-development-artifacts:
    if: inputs.build_ios != false
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - name: Restore iOS Rust release dependency cache
        id: ios-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/.fingerprint
            target/debug/build
            target/aarch64-apple-ios/release/deps
            target/aarch64-apple-ios/release/.fingerprint
            target/aarch64-apple-ios/release/build
            target/aarch64-apple-ios-sim/release/deps
            target/aarch64-apple-ios-sim/release/.fingerprint
            target/aarch64-apple-ios-sim/release/build
          key: rust-ios-artifacts-${{ runner.os }}-${{ runner.arch }}-1.98.1-release-mobile-bindings-default-aarch64-apple-ios-aarch64-apple-ios-sim-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mobile-bindings/Cargo.toml') }}
      - name: Build simulator app and unsigned device archive
        env:
          PEPPY_GOOGLE_IOS_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_IOS_CLIENT_ID }}
          PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID }}
          PEPPY_GOOGLE_REVERSED_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_REVERSED_CLIENT_ID }}
        run: infra/build/build-ios-artifacts.sh
      - name: Save iOS Rust release dependency cache
        id: ios-rust-cache-save
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/production' && steps.ios-rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/.fingerprint
            target/debug/build
            target/aarch64-apple-ios/release/deps
            target/aarch64-apple-ios/release/.fingerprint
            target/aarch64-apple-ios/release/build
            target/aarch64-apple-ios-sim/release/deps
            target/aarch64-apple-ios-sim/release/.fingerprint
            target/aarch64-apple-ios-sim/release/build
          key: rust-ios-artifacts-${{ runner.os }}-${{ runner.arch }}-1.98.1-release-mobile-bindings-default-aarch64-apple-ios-aarch64-apple-ios-sim-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mobile-bindings/Cargo.toml') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-${{ inputs.trusted_update_build && 'release' || 'development' }}-artifacts
          path: dist/ios/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
