name: Development artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      version:
        description: Version to stamp into artifacts
        required: false
        type: string
        default: ''
      android_version:
        description: Android version to stamp into artifacts
        required: false
        type: string
        default: ''
      build_android:
        description: Build Android artifacts
        required: false
        type: boolean
        default: true
      build_desktop:
        description: Build desktop artifacts
        required: false
        type: boolean
        default: true
      build_ios:
        description: Build iOS artifacts
        required: false
        type: boolean
        default: true
      android_version_code:
        description: Android version code to stamp into artifacts
        required: false
        type: string
        default: ''
      wix_version:
        description: WiX version to stamp into Windows artifacts
        required: false
        type: string
        default: ''
      android_firebase_app_config:
        description: Public Firebase Android app configuration JSON for the official Android artifact
        required: false
        type: string
        default: ''
      trusted_update_build:
        description: Build signed updater artifacts from a protected release caller
        required: false
        type: boolean
        default: false
      update_channel:
        description: Trusted updater channel
        required: false
        type: string
        default: ''
    secrets:
      PEPPY_UPDATER_PRIVATE_KEY:
        required: false
      PEPPY_UPDATER_PRIVATE_KEY_PASSWORD:
        required: false
      PEPPY_RELEASE_RPM_GPG_KEY:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      PEPPY_DESKTOP_GOOGLE_CLIENT_SECRET:
        required: false
      PEPPY_ANDROID_KEYSTORE_BASE64:
        required: false
      PEPPY_ANDROID_KEYSTORE_PASSWORD:
        required: false
      PEPPY_ANDROID_KEY_ALIAS:
        required: false
      PEPPY_ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: production
        type: string
      version:
        description: Version to stamp into artifacts
        required: false
        type: string
        default: ''
      android_version:
        description: Android version to stamp into artifacts
        required: false
        type: string
        default: ''
      build_android:
        description: Build Android artifacts
        required: false
        type: boolean
        default: true
      build_desktop:
        description: Build desktop artifacts
        required: false
        type: boolean
        default: true
      build_ios:
        description: Build iOS artifacts
        required: false
        type: boolean
        default: true
      android_version_code:
        description: Android version code to stamp into artifacts
        required: false
        type: string
        default: ''
      wix_version:
        description: WiX version to stamp into Windows artifacts
        required: false
        type: string
        default: ''
      android_firebase_app_config:
        description: Public Firebase Android app configuration JSON for the official Android artifact
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  android-development-artifacts:
    if: inputs.build_android != false
    environment: "${{ inputs.trusted_update_build && format('updates-{0}', inputs.update_channel) || 'development-artifacts' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reject untrusted Android build context
        if: inputs.trusted_update_build
        shell: bash
        env:
          CHANNEL: ${{ inputs.update_channel }}
          REQUESTED_REF: ${{ inputs.ref }}
          BUILD_DESKTOP: ${{ inputs.build_desktop }}
        run: |
          [ "$REQUESTED_REF" = "$GITHUB_SHA" ] || { echo 'trusted Android build ref must equal the triggering SHA' >&2; exit 1; }
          [ "$BUILD_DESKTOP" != false ] || { echo 'trusted Android builds must include desktop artifacts' >&2; exit 1; }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF:$CHANNEL" in
            workflow_dispatch:refs/heads/production:stable|push:refs/heads/production:stable|push:refs/heads/staging:staging) ;;
            *) echo 'trusted Android builds require a production stable dispatch/push or staging push' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out trusted Android context
        if: inputs.trusted_update_build
        shell: bash
        env:
          CHANNEL: ${{ inputs.update_channel }}
          REQUESTED_SHA: ${{ inputs.ref }}
        run: bash .github/scripts/release-context-guard.sh
      - name: Validate protected Android signing inputs
        if: inputs.trusted_update_build
        shell: bash
        env:
          PEPPY_ANDROID_KEYSTORE_BASE64: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEYSTORE_BASE64 || '' }}
          PEPPY_ANDROID_KEYSTORE_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEYSTORE_PASSWORD || '' }}
          PEPPY_ANDROID_KEY_ALIAS: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEY_ALIAS || '' }}
          PEPPY_ANDROID_KEY_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEY_PASSWORD || '' }}
          PEPPY_ANDROID_SIGNING_CERT_SHA256: ${{ inputs.trusted_update_build && vars.PEPPY_ANDROID_SIGNING_CERT_SHA256 || '' }}
        run: |
          for input in PEPPY_ANDROID_KEYSTORE_BASE64 PEPPY_ANDROID_KEYSTORE_PASSWORD PEPPY_ANDROID_KEY_ALIAS PEPPY_ANDROID_KEY_PASSWORD PEPPY_ANDROID_SIGNING_CERT_SHA256; do
            [ -n "${!input}" ] || { echo "missing protected Android signing input: $input" >&2; exit 1; }
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libssl-dev libsodium-dev
      - name: Install Android NDK
        run: |
          set +e
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"
      - name: Test Firebase Android app configuration validation
        run: node --test infra/build/validate-firebase-app-config.test.mjs
      - name: Configure optional Firebase Android app
        env:
          PEPPY_ANDROID_FIREBASE_APP_CONFIG: ${{ inputs.android_firebase_app_config || vars.PEPPY_ANDROID_FIREBASE_APP_CONFIG }}
        run: node infra/build/validate-firebase-app-config.mjs
      - name: Build trusted Android release artifacts
        if: inputs.trusted_update_build
        env:
          VERSION: ${{ inputs.android_version || inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID }}
          PEPPY_ANDROID_NATIVE_PROFILE: release
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          infra/compose/verify-android-native.sh
          cd apps/android
          if [[ -n "$VERSION" || -n "$ANDROID_VERSION_CODE" ]]; then
            if [[ -z "$VERSION" || -z "$ANDROID_VERSION_CODE" ]]; then
              echo "version and android_version_code must both be set" >&2
              exit 1
            fi
            ./gradlew :app:assembleRelease :app:bundleRelease \
              "-PpeppyVersionName=$VERSION" "-PpeppyVersionCode=$ANDROID_VERSION_CODE"
          else
            ./gradlew :app:assembleRelease :app:bundleRelease
          fi
          mkdir -p ../../dist/android-release
          install -m 0644 app/build/outputs/apk/release/app-release-unsigned.apk ../../dist/android-release/peppy-android-unsigned.apk
          install -m 0644 app/build/outputs/bundle/release/app-release.aab ../../dist/android-release/peppy-android-unsigned.aab
      - name: Stop Android Gradle daemon before signing
        if: inputs.trusted_update_build
        working-directory: apps/android
        run: ./gradlew --stop
      - name: Sign trusted Android release artifacts
        if: inputs.trusted_update_build
        env:
          PEPPY_ANDROID_KEYSTORE_BASE64: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEYSTORE_BASE64 || '' }}
          PEPPY_ANDROID_KEYSTORE_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEYSTORE_PASSWORD || '' }}
          PEPPY_ANDROID_KEY_ALIAS: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEY_ALIAS || '' }}
          PEPPY_ANDROID_KEY_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_ANDROID_KEY_PASSWORD || '' }}
          PEPPY_ANDROID_SIGNING_CERT_SHA256: ${{ inputs.trusted_update_build && vars.PEPPY_ANDROID_SIGNING_CERT_SHA256 || '' }}
        run: bash infra/release/sign-android-artifacts.sh dist/android-release/peppy-android-unsigned.apk dist/android-release/peppy-android-unsigned.aab dist/android-release
      - name: Build development Android debug APK
        if: ${{ !inputs.trusted_update_build }}
        env:
          VERSION: ${{ inputs.android_version || inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID }}
          PEPPY_ANDROID_NATIVE_PROFILE: release
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          infra/compose/verify-android-native.sh
          cd apps/android
          if [[ -n "$VERSION" || -n "$ANDROID_VERSION_CODE" ]]; then
            if [[ -z "$VERSION" || -z "$ANDROID_VERSION_CODE" ]]; then
              echo "version and android_version_code must both be set" >&2
              exit 1
            fi
            ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease "-PpeppyVersionName=$VERSION" "-PpeppyVersionCode=$ANDROID_VERSION_CODE"
          else
            ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease
          fi
          mkdir -p ../../dist/android-release
          install -m 0644 app/build/outputs/apk/debug/app-debug.apk ../../dist/android-release/peppy-android-debug.apk
      - if: inputs.trusted_update_build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-artifacts
          path: |
            dist/android-release/peppy-android.apk
            dist/android-release/peppy-android.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - if: ${{ !inputs.trusted_update_build }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-development-artifacts
          path: dist/android-release/peppy-android-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  desktop-development-artifacts:
    if: inputs.build_desktop != false
    environment: "${{ inputs.trusted_update_build && format('updates-{0}', inputs.update_channel) || 'development-artifacts' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            bundles: appimage,deb,rpm
            posix_bundles: appimage deb rpm
            path: dist/desktop-linux-bundles.tar.gz
          - os: macos-26
            name: macos
            bundles: app,dmg
            posix_bundles: macos
            path: |
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              dist/desktop-macos-app.tar.gz
          - os: windows-2025
            name: windows
            bundles: nsis,msi
            path: |
              apps/desktop/src-tauri/target/release/bundle/nsis/**
              apps/desktop/src-tauri/target/release/bundle/msi/**
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Reject untrusted updater build context
        if: inputs.trusted_update_build
        shell: bash
        env:
          CHANNEL: ${{ inputs.update_channel }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          [ "$REQUESTED_REF" = "$GITHUB_SHA" ] || { echo 'trusted updater build ref must equal the triggering SHA' >&2; exit 1; }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF:$CHANNEL" in
            workflow_dispatch:refs/heads/production:stable|push:refs/heads/production:stable|push:refs/heads/staging:staging) ;;
            *) echo 'trusted updater builds require a production stable dispatch/push or staging push' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checked-out trusted updater context
        if: inputs.trusted_update_build
        shell: bash
        env:
          CHANNEL: ${{ inputs.update_channel }}
          REQUESTED_SHA: ${{ inputs.ref }}
        run: bash .github/scripts/release-context-guard.sh
      - name: Validate protected signing policy
        if: inputs.trusted_update_build
        shell: bash
        env:
          PEPPY_MACOS_SIGNING_MODE: ${{ vars.PEPPY_MACOS_SIGNING_MODE || 'developer-id' }}
          PEPPY_WINDOWS_SIGNING_MODE: ${{ vars.PEPPY_WINDOWS_SIGNING_MODE || 'authenticode' }}
        run: bash .github/scripts/release-signing-readiness.sh --validate-modes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Remove preinstalled package-manager shims
        if: runner.os == 'Windows'
        run: npm uninstall --global yarn pnpm
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libsqlite3-dev libssl-dev libsodium-dev libsecret-1-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev rpm
      - if: runner.os == 'Linux' && inputs.trusted_update_build
        name: Install pinned RPM metadata tool
        shell: bash
        run: |
          infra/release/install-rpmrebuild.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        name: Select native Windows Perl
        shell: pwsh
        run: |
          $perl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop).Source
          if ($perl -match '(?i)\\(?:Git\\usr|msys64\\usr)\\bin\\perl\.exe$') {
            $perl = 'C:\Strawberry\perl\bin\perl.exe'
            if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
              throw "Native Strawberry Perl was not found at $perl"
            }
          }
          $perl = (Resolve-Path -LiteralPath $perl).ProviderPath
          & $perl -MIPC::Cmd -e '1'
          if ($LASTEXITCODE -ne 0) {
            throw "Native Perl at $perl cannot load IPC::Cmd"
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - if: runner.os == 'Windows' && inputs.trusted_update_build && vars.PEPPY_WINDOWS_SIGNING_MODE != 'none'
        name: Import protected Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ inputs.trusted_update_build && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.trusted_update_build && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'Windows Authenticode certificate inputs are required for trusted builds' }
          $path = Join-Path $env:RUNNER_TEMP 'peppy-authenticode.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $path -Force
          "PEPPY_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Tauri bundles
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          VERSION: ${{ inputs.version }}
          WIX_VERSION: ${{ inputs.wix_version }}
          TRUSTED_UPDATE_BUILD: ${{ inputs.trusted_update_build }}
          PEPPY_UPDATE_CHANNEL: ${{ inputs.update_channel }}
          PEPPY_UPDATE_PUBLIC_KEY: ${{ inputs.trusted_update_build && vars.PEPPY_UPDATE_PUBLIC_KEY || '' }}
          PEPPY_DESKTOP_GOOGLE_CLIENT_ID: ${{ inputs.trusted_update_build && vars.PEPPY_DESKTOP_GOOGLE_CLIENT_ID || '' }}
          PEPPY_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ inputs.trusted_update_build && secrets.PEPPY_DESKTOP_GOOGLE_CLIENT_SECRET || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.trusted_update_build && secrets.PEPPY_UPDATER_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.trusted_update_build && secrets.PEPPY_UPDATER_PRIVATE_KEY_PASSWORD || '' }}
          PEPPY_MACOS_SIGNING_MODE: ${{ inputs.trusted_update_build && (vars.PEPPY_MACOS_SIGNING_MODE || 'developer-id') || '' }}
          PEPPY_WINDOWS_SIGNING_MODE: ${{ inputs.trusted_update_build && (vars.PEPPY_WINDOWS_SIGNING_MODE || 'authenticode') || '' }}
          APPLE_CERTIFICATE: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.trusted_update_build && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: infra/release/build-desktop-bundles.sh
      - if: always() && runner.os == 'Windows' && inputs.trusted_update_build && vars.PEPPY_WINDOWS_SIGNING_MODE != 'none'
        name: Remove protected Authenticode certificate
        shell: pwsh
        run: |
          if ($env:PEPPY_WINDOWS_CERT_THUMBPRINT) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:PEPPY_WINDOWS_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue }
      - if: runner.os == 'Linux' && inputs.trusted_update_build
        name: Normalize and sign trusted Linux package metadata
        env:
          CANONICAL_VERSION: ${{ inputs.version }}
          PEPPY_RELEASE_RPM_GPG_KEY: ${{ inputs.trusted_update_build && secrets.PEPPY_RELEASE_RPM_GPG_KEY || '' }}
          PEPPY_RELEASE_RPM_GPG_KEY_ID: ${{ inputs.trusted_update_build && vars.PEPPY_RELEASE_RPM_GPG_KEY_ID || '' }}
        run: |
          infra/release/normalize-linux-package-metadata.sh "$CANONICAL_VERSION" apps/desktop/src-tauri/target/release/bundle
          infra/release/sign-rpm.sh apps/desktop/src-tauri/target/release/bundle/rpm
      - if: runner.os == 'Linux'
        name: Preserve POSIX bundle permissions
        shell: bash
        run: |
          mkdir -p dist
          tar -C apps/desktop/src-tauri/target/release/bundle \
             -czf "dist/desktop-${{ matrix.name }}-bundles.tar.gz" ${{ matrix.posix_bundles }}
      - if: runner.os == 'macOS'
        name: Preserve development macOS app archive
        shell: bash
        run: |
          mkdir -p dist
          archive="$PWD/dist/desktop-macos-app.tar.gz"
          (
            cd apps/desktop/src-tauri/target/release/bundle/macos
            tar -czf "$archive" -- *.app
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.name }}-${{ inputs.trusted_update_build && 'release' || 'development' }}-artifacts
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios-development-artifacts:
    if: inputs.build_ios != false
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Build simulator app and unsigned device archive
        env:
          PEPPY_GOOGLE_IOS_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_IOS_CLIENT_ID }}
          PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_NATIVE_SERVER_CLIENT_ID }}
          PEPPY_GOOGLE_REVERSED_CLIENT_ID: ${{ vars.PEPPY_GOOGLE_REVERSED_CLIENT_ID }}
        run: infra/build/build-ios-artifacts.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-${{ inputs.trusted_update_build && 'release' || 'development' }}-artifacts
          path: dist/ios/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
