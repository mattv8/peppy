name: Container image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      version:
        description: Version to stamp into OCI metadata
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  container-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build container images
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must match X.Y.Z or X.Y.Z-prerelease" >&2
            exit 1
          fi
          for image in peppy-server peppy-push-relay; do
            dockerfile="docker/${image#peppy-}.Dockerfile"
            if [[ "$image" == peppy-server ]]; then dockerfile=docker/server.Dockerfile; fi
            docker_args=(
              --file "$dockerfile"
              --tag "$image:ci"
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)"
              --label "org.opencontainers.image.title=$image"
              --label "org.opencontainers.image.licenses=Apache-2.0"
            )
            if [[ -n "$VERSION" ]]; then docker_args+=(--label "org.opencontainers.image.version=$VERSION"); fi
            docker build "${docker_args[@]}" .
          done
      - run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint /bin/sh \
            peppy-server:ci -ec '
              test "$(id -u)" = 10001
              test -s /etc/ssl/certs/ca-certificates.crt
              test -x /usr/local/bin/peppy-server
              command -v ldd >/dev/null
              ! ldd /usr/local/bin/peppy-server | grep "not found"
            '
      - name: Check relay image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint /bin/sh \
            peppy-push-relay:ci -ec '
              test "$(id -u)" = 10001
              test -s /etc/ssl/certs/ca-certificates.crt
              test -x /usr/local/bin/peppy-push-relay
              command -v ldd >/dev/null
              ! ldd /usr/local/bin/peppy-push-relay | grep "not found"
            '
