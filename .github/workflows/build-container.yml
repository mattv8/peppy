name: Container image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      version:
        description: Version to stamp into OCI metadata
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must match X.Y.Z or X.Y.Z-prerelease" >&2
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$VERSION" ]]; then echo "version_label=org.opencontainers.image.version=$VERSION" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/server.Dockerfile
          load: true
          push: false
          tags: peppy-server:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.title=peppy-server
            org.opencontainers.image.licenses=Apache-2.0
            ${{ steps.metadata.outputs.version_label }}
          cache-from: type=gha,scope=container-server
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'type=gha,mode=min,scope=container-server' || '' }}
      - name: Check server image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint /bin/sh \
            peppy-server:ci -ec '
              test "$(id -u)" = 10001
              test -s /etc/ssl/certs/ca-certificates.crt
              test -x /usr/local/bin/peppy-server
              command -v ldd >/dev/null
              ! ldd /usr/local/bin/peppy-server | grep "not found"
            '

  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must match X.Y.Z or X.Y.Z-prerelease" >&2
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$VERSION" ]]; then echo "version_label=org.opencontainers.image.version=$VERSION" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/push-relay.Dockerfile
          load: true
          push: false
          tags: peppy-push-relay:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.title=peppy-push-relay
            org.opencontainers.image.licenses=Apache-2.0
            ${{ steps.metadata.outputs.version_label }}
          cache-from: type=gha,scope=container-relay
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'type=gha,mode=min,scope=container-relay' || '' }}
      - name: Check relay image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint /bin/sh \
            peppy-push-relay:ci -ec '
              test "$(id -u)" = 10001
              test -s /etc/ssl/certs/ca-certificates.crt
              test -x /usr/local/bin/peppy-push-relay
              command -v ldd >/dev/null
              ! ldd /usr/local/bin/peppy-push-relay | grep "not found"
            '

  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must match X.Y.Z or X.Y.Z-prerelease" >&2
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$VERSION" ]]; then echo "version_label=org.opencontainers.image.version=$VERSION" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/mcp.Dockerfile
          load: true
          push: false
          tags: peppy-mcp:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.title=peppy-mcp
            org.opencontainers.image.licenses=Apache-2.0
            ${{ steps.metadata.outputs.version_label }}
          cache-from: type=gha,scope=container-mcp
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'type=gha,mode=min,scope=container-mcp' || '' }}
      - name: Check MCP image
        run: bash infra/docker/test-mcp-image.sh peppy-mcp:ci

  complete:
    if: ${{ always() }}
    needs: [server, relay, mcp]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every container image validation
        env:
          SERVER_RESULT: ${{ needs.server.result }}
          RELAY_RESULT: ${{ needs.relay.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
        run: |
          for result in "$SERVER_RESULT" "$RELAY_RESULT" "$MCP_RESULT"; do
            [[ "$result" == success ]] || exit 1
          done
