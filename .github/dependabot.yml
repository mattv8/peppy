version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-tooling:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      android-build-tooling:
        patterns:
          - "*"
