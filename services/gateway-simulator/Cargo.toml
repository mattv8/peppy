[package]
name = "peppy-gateway-simulator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
peppy-client-core.workspace = true
peppy-crypto.workspace = true
peppy-domain.workspace = true
peppy-hosted-api.workspace = true
peppy-hosted-client = { path = "../../crates/hosted-client", version = "0.1.0" }
base64.workspace = true
futures-util.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
axum.workspace = true
peppy-server = { path = "../server", version = "0.1.0" }
sqlx = { workspace = true, features = ["uuid"] }
tempfile.workspace = true
sha2.workspace = true
