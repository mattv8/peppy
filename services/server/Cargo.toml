[package]
name = "peppy-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
peppy-protocol.workspace = true
peppy-domain.workspace = true
hex.workspace = true
# Unused since health signing moved to the aws-sigv4 adapter; removal needs a root Cargo.lock refresh.
hmac.workspace = true
ipnet.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sqlx = { workspace = true, features = ["uuid"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
tokio-util = { workspace = true, features = ["io"] }
aws-credential-types = "=1.2.8"
aws-sigv4 = "=1.3.6"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
sha2.workspace = true
time = { version = "=0.3.55", features = ["formatting", "macros"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
peppy-client-core.workspace = true
peppy-crypto.workspace = true
tempfile.workspace = true
http-body-util.workspace = true
tower.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite.workspace = true
