services:
  web: !reset null

  dev:
    command: [run, demo]
    depends_on: !reset
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports: !reset []
    environment:
      PEPPY_WEB_CLIENT_ROOT: "false"
      PEPPY_ISOLATED_DEMO: "1"
      PEPPY_DEV_TLS_CERT: /tls/ca.pem
      PEPPY_DEMO_CARGO_TIMEOUT: ${PEPPY_DEMO_CARGO_TIMEOUT:?demo cargo timeout is required}
      PEPPY_DEMO_RUN: ${PEPPY_DEMO_RUN:?demo run directory is required}
    volumes:
      - ${PEPPY_DEV_TLS_DIR:?local TLS directory is required}/ca.pem:/tls/ca.pem:ro

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    network_mode: service:dev
    depends_on:
      dev:
        condition: service_started
    volumes:
      - ./infra/proxy/demo.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PEPPY_DEV_TLS_DIR:?local TLS directory is required}/server.pem:/certs/server.pem:ro
      - ${PEPPY_DEV_TLS_DIR:?local TLS directory is required}/server-key.pem:/certs/server-key.pem:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
