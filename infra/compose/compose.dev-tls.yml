services:
  dev:
    ports: !reset []

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    depends_on:
      dev:
        condition: service_healthy
    volumes:
      - ./infra/proxy/dev.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PEPPY_DEV_TLS_DIR:?local TLS directory is required}/server.pem:/certs/server.pem:ro
      - ${PEPPY_DEV_TLS_DIR:?local TLS directory is required}/server-key.pem:/certs/server-key.pem:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-7000}:443"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [edge]

  android:
    environment:
      PEPPY_DEV_TLS_CERT: /tls/ca.pem
    volumes:
      - ${PEPPY_DEV_TLS_DIR:?local TLS directory is required}/ca.pem:/tls/ca.pem:ro
