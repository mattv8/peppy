<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Peppy</title>
    <style>
      :root {
        --peppy-surface-desk: #252526;
        --peppy-surface-widget: #202020;
        --peppy-border: #2b2b2b;
        --peppy-text-strong: #fff;
        --peppy-text-secondary: #9d9d9d;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #callback-page {
        align-items: center;
        background: var(--peppy-surface-desk);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: 16px;
      }

      #callback-card {
        background: var(--peppy-surface-widget);
        border: 1px solid var(--peppy-border);
        border-radius: 12px;
        padding: 32px 24px;
        text-align: center;
        width: min(360px, 100%);
      }

      #callback-logo { display: block; margin: 0 auto; }

      h1 {
        color: var(--peppy-text-strong);
        font-size: 20px;
        font-weight: 600;
        line-height: 28px;
        margin: 16px 0 0;
      }

      #callback-message {
        color: var(--peppy-text-secondary);
        font-size: 14px;
        line-height: 20px;
        margin: 12px 0 0;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --peppy-surface-desk: #f3f3f3;
          --peppy-surface-widget: #fff;
          --peppy-border: #e5e5e5;
          --peppy-text-strong: #1f1f1f;
          --peppy-text-secondary: #616161;
        }
      }

      @media (forced-colors: active) {
        :root {
          --peppy-surface-desk: Canvas;
          --peppy-surface-widget: Canvas;
          --peppy-border: CanvasText;
          --peppy-text-strong: CanvasText;
          --peppy-text-secondary: CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <main id="callback-page">
      <div id="callback-card" data-outcome="{{OUTCOME}}">
        <img id="callback-logo" alt="" width="48" height="48" src="{{LOGO_SRC}}">
        <h1>{{HEADING}}</h1>
        <p id="callback-message">{{MESSAGE}}</p>
      </div>
    </main>
  </body>
</html>
