org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
# Gradle 9.9.2 internal repository retry tuning (verified for this pin; not public API; recheck on wrapper upgrades).
# Maven Central HTTP 429 and other transient failures get 3 total attempts, waiting 30s then 60s, before the repository is disabled for the build.
# Adds up to 90s per failing resolution operation; it does not honor Retry-After or change the transient classifier.
systemProp.org.gradle.internal.repository.initial.backoff=30000
systemProp.org.gradle.internal.repository.max.tentatives=3
