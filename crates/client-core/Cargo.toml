[package]
name = "peppy-client-core"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[features]
test-support = []

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "ephemeral"
path = "tests/ephemeral.rs"

[[test]]
name = "ephemeral_v2_runtime"
path = "tests/ephemeral_v2_runtime.rs"

[[test]]
name = "ephemeral_v2_receive"
path = "tests/ephemeral_v2_receive.rs"

[[test]]
name = "rcs_receive"
path = "tests/rcs_receive.rs"

[[test]]
name = "rcs_status"
path = "tests/rcs_status.rs"

[[test]]
name = "rcs_receive_regressions"
path = "tests/rcs_receive_regressions.rs"

[[test]]
name = "rcs_target"
path = "tests/rcs_target.rs"

[[test]]
name = "rcs_carrier_regressions"
path = "tests/rcs_carrier_regressions.rs"

[[test]]
name = "one_time_code"
path = "tests/one_time_code.rs"

[dependencies]
base64.workspace = true
peppy-crypto.workspace = true
peppy-domain.workspace = true
peppy-protocol.workspace = true
# Matches SQLx 0.8's libsqlite3-sys 0.30 links dependency in this workspace.
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
phonenumber = { path = "../../vendor/phonenumber", version = "=0.3.10" }

[target.'cfg(any(target_os = "android", target_os = "windows"))'.dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile.workspace = true
