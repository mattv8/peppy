[package]
name = "peppy-mobile-bindings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "MPL-2.0"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
peppy-client-core.workspace = true
peppy-crypto.workspace = true
peppy-protocol.workspace = true
peppy-hosted-api.workspace = true
peppy-hosted-client = { path = "../hosted-client", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi = "=0.32.2"
base64.workspace = true
libsodium-rs.workspace = true
uuid.workspace = true
zeroize.workspace = true
sha2.workspace = true
url.workspace = true

[features]
cli = ["uniffi/cli"]

[dev-dependencies]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]
