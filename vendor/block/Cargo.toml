[package]
name = "block"
version = "0.1.6"
edition = "2015"
authors = ["Steven Sheldon"]

description = "Rust interface for Apple's C language extension of blocks."
keywords = ["blocks", "osx", "ios", "objective-c"]
readme = "README.md"
repository = "http://github.com/SSheldon/rust-block"
documentation = "http://ssheldon.github.io/rust-objc/block/"
license = "MIT"

exclude = [
    ".gitignore",
    ".travis.yml",
    "travis_install.sh",
    "travis_test.sh",
    "tests-ios/**",
]

# Upstream's fixture dependency is a local `test_utils` package omitted from
# the crates.io archive. Its test sources are retained only for provenance;
# the desktop macOS integration test exercises this runtime patch instead.
